<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Nunito 900 is the brand wordmark's face, on the sign-in screen's
         lockup. Only the wordmark uses it — everything else in the app is the
         system stack — and `display=swap` means a till with no connection
         falls back rather than waiting on it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
    <title>Omaykan App</title>
  </head>
