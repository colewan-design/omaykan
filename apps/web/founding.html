<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Become an Omaykan Founding Seller — the first 30 Baguio businesses</title>
    <meta
      name="description"
      content="Join the first 30 Baguio and La Trinidad businesses on Omaykan. ₱0 setup, ₱0 commission, free for 2–3 months, then ₱199/month — and a founding-seller number that stays yours."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="canonical" href="https://omaykan.com/seller/founding" />

    <!-- This is the page a flyer and a QR code point at, so it is also the one
         most often pasted into Messenger. Without these the preview is a bare
         URL, which for a campaign aimed at shop owners is most of the pitch
         lost. Same treatment as the shop pages got. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Omaykan" />
    <meta property="og:title" content="Become an Omaykan Founding Seller" />
    <meta
      property="og:description"
      content="The first 30 Baguio / La Trinidad businesses. ₱0 setup, ₱0 commission, free for 2–3 months, then ₱199/month."
    />
    <meta property="og:url" content="https://omaykan.com/seller/founding" />
    <meta property="og:image" content="https://omaykan.com/storefront/market-stall-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Caveat: the script lines on the badge card and the footer.
         Nunito 900: the heavy rounded lowercase of the brand wordmark. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- A crawler that does not run scripts sees only the empty mount div
         below, and reports the page as having no outgoing links. The build
         prerenders the public entries (scripts/prerender.mjs), but this is
         what stands if a page is served unprerendered, and it is what a
         visitor with scripting off gets instead of a blank screen. -->
    <noscript>
      <nav aria-label="Omaykan" class="noscript-nav">
        <p>
          Omaykan needs JavaScript to run the application form. To apply as a
          founding seller, email support@omaykan.com with your business name,
          your address and what you sell. The rest of the site is here:
        </p>
        <ul>
          <li><a href="/">Shops and products</a></li>
          <li><a href="/about">Our story</a></li>
          <li><a href="/seller/signup">Sell with us</a></li>
          <li><a href="/rider">Ride with Omaykan</a></li>
          <li><a href="/account">Your account</a></li>
          <li><a href="/cart">Your cart</a></li>
        </ul>
      </nav>
    </noscript>
    <div id="founding-app"></div>
    <script type="module" src="/src/founding/main.ts"></script>
  </body>
</html>
