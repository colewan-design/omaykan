<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ride with Omaykan</title>
    <meta
      name="description"
      content="Deliver for local shops on Omaykan and keep 100% of every delivery fee. Sign up with your driver's licence and plate."
    />
    <!-- The sign-up side is worth finding; everything past it is a signed-in
         account screen, which has nothing for a crawler. Left indexable
         deliberately, unlike /account — this page is how a rider hears about
         it at all. -->
    <meta name="theme-color" content="#1a6b3c" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>
  <body>
    <!-- A crawler that does not run scripts sees only the empty mount div
         below, and reports the page as having no outgoing links. The build
         prerenders the public entries (scripts/prerender.mjs), but this is
         what stands if a page is served unprerendered, and it is what a
         visitor with scripting off gets instead of a blank screen. -->
    <noscript>
      <nav aria-label="Omaykan" class="noscript-nav">
        <p>Omaykan needs JavaScript to browse and order. The site is here:</p>
        <ul>
          <li><a href="/">Shops and products</a></li>
          <li><a href="/about">Our story</a></li>
          <li><a href="/seller/signup">Sell with us</a></li>
          <li><a href="/rider">Ride with Omaykan</a></li>
          <li><a href="/account">Your account</a></li>
          <li><a href="/cart">Your cart</a></li>
        </ul>
      </nav>
    </noscript>
    <div id="rider-app"></div>
    <script type="module" src="/src/rider/main.ts"></script>
  </body>
</html>
